<!-- Heatmap control panel markup.
     Template placeholders: $opacity_pct (integer 0-100). -->
<div id="heatmap-control-panel" class="heatmap-control-panel" aria-label="Map controls">
  <div class="hcp-header">
    <span>Map Controls</span>
    <button type="button" id="hcp-toggle" class="hcp-toggle-btn"
            title="Expand / collapse">&minus;</button>
  </div>
  <div class="hcp-body">
    <div class="hcp-section">
      <div class="hcp-label">Basemap</div>
      <div class="hcp-segments" id="hcp-basemap"></div>
    </div>
    <div class="hcp-section hcp-section-layers">
      <div id="hcp-layers"></div>
    </div>
    <div class="hcp-section">
      <label class="hcp-label" for="hcp-opacity">
        Opacity <span id="hcp-opacity-value">$opacity_pct%</span>
      </label>
      <input type="range" id="hcp-opacity" min="0" max="100" step="1" value="$opacity_pct" />
    </div>
    <div class="hcp-section hcp-actions">
      <button type="button" id="hcp-fit">Fit map</button>
      <button type="button" id="hcp-reset">Reset</button>
      <button type="button" id="hcp-legend">Legend</button>
    </div>
  </div>
</div>
