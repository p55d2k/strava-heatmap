<!-- Heatmap control panel markup.
     Layer opacity sliders are rendered client-side by assets/panel.js (one per
     independent layer, one shared slider per mutually-exclusive radio group)
     and are collapsed by default ("Layer opacity" toggle). A slider is greyed
     out while its layer is not on the map, and re-enables via overlayadd /
     overlayremove when the layer becomes visible. The "Advanced"
     section (rasterization-mode dropdown + Home marker toggle) sits below the
     Layer opacity section and is collapsed by default too — the Home marker
     toggle collapses together with it.

     Controls that need explaining carry a `data-hcp-help` attribute holding a
     short, plain-language explanation. assets/panel.js shows that text in a
     small floating card when the pointer rests on the control (or the control
     takes keyboard focus); the `.hcp-info` badge is the visual cue that the
     explanation exists. The client-rendered controls (basemap buttons, layer
     toggles, opacity sliders) get the same treatment from panel.js.

     The Layer opacity and Advanced section headers, and the Fit map / Reset /
     Legend buttons, deliberately carry no explanation — their labels already
     say what they do. The three export buttons (Save as PNG / Export GeoJSON /
     Export GPX) do carry one: what ends up in the exported file is not obvious
     from their labels alone.

     The export buttons live in their own section below the actions because they
     are primary actions rather than view controls, and because their shared
     status line needs the full sidebar width. The image library Save as PNG
     needs is fetched by panel.js on first click, never at page load; the
     GeoJSON and the GPX track export are embedded in the page as inert script
     blocks (<script type="application/geo+json"> and
     <script type="application/gpx+xml">) that panel.js hands to the browser as
     downloads — the GPX one compressed, since that document is around ten times
     smaller that way. -->
<div id="heatmap-control-panel" class="heatmap-control-panel hcp-opacity-collapsed" aria-label="Map controls">
  <div class="hcp-header">
    <span>Map Controls</span>
  </div>
  <div class="hcp-body">
    <div class="hcp-section">
      <div class="hcp-label" data-hcp-help="The background map that sits behind your heatmap. Pick whichever style is easiest for you to read.">
        <span>Basemap <span class="hcp-info" aria-hidden="true">i</span></span>
      </div>
      <div class="hcp-segments" id="hcp-basemap"></div>
      <label class="hcp-layer-row hcp-basemap-labels"
             data-hcp-help="Shows or hides the place names and road labels on the background map. Turning them off gives the heatmap a cleaner, uncluttered look.">
        <input type="checkbox" id="hcp-basemap-labels" checked />
        <span>Labels <span class="hcp-info" aria-hidden="true">i</span></span>
      </label>
    </div>
    <div class="hcp-section hcp-section-layers">
      <div id="hcp-layers"></div>
    </div>
    <!-- Date range filter: hides the section unless the build embedded the
         per-activity cell counts (the tooltips index's `visits` array) and
         the date bounds (see assets/panel.js). The two-thumb range slider
         seeds to the full range; narrowing it re-rasterizes the density /
         coverage layers in the browser, so the map narrows without rebuilding
         the page. The From/To readouts above the slider show the dates the
         thumbs currently sit on. Metrics (pace, heart rate, gradient) are
         computed from per-activity averages and are left untouched by the
         filter. -->
    <div class="hcp-section hcp-section-dates" id="hcp-dates-section" hidden>
      <div class="hcp-label" data-hcp-help="Show only the activities within a date range. The heatmap is redrawn in your browser from the per-activity cell counts the page already carries, so the map narrows instantly — no rebuild needed.">
        <span>Date range <span class="hcp-info" aria-hidden="true">i</span></span>
      </div>
      <div class="hcp-date-range">
        <span class="hcp-date-bound"><span class="hcp-date-name">From</span><span class="hcp-date-readout" id="hcp-date-from-readout"></span></span>
        <span class="hcp-date-bound"><span class="hcp-date-name">To</span><span class="hcp-date-readout" id="hcp-date-to-readout"></span></span>
        <button type="button" id="hcp-date-reset" class="hcp-date-reset">Reset</button>
      </div>
      <div class="hcp-date-slider">
        <div class="hcp-date-slider-fill" id="hcp-date-slider-fill"></div>
        <input type="range" id="hcp-date-from" aria-label="Earliest date" />
        <input type="range" id="hcp-date-to" aria-label="Latest date" />
      </div>
      <div id="hcp-date-status" class="hcp-date-status" role="status" aria-live="polite"></div>
      <!-- Timeline: shows how coverage grew over time. A period selector
           (year / month / week), a single slider across the periods present in
           the data, and a Play button that steps through them automatically.
           Everything re-uses the same in-browser re-rasterization as the date
           range above, so it needs no server. Hidden until the build supplies
           period buckets (see src/timeline.py). -->
      <div class="hcp-timeline" id="hcp-timeline" hidden>
        <div class="hcp-timeline-head">
          <label class="hcp-timeline-label" for="hcp-timeline-period" data-hcp-help="Step the heatmap through time to watch coverage grow. Pick the period size (year, month or week) and drag or press Play.">
            <span>Timeline <span class="hcp-info" aria-hidden="true">i</span></span>
          </label>
          <select id="hcp-timeline-period" class="hcp-select"></select>
          <button type="button" id="hcp-timeline-play" class="hcp-timeline-play" aria-pressed="false">Play</button>
        </div>
        <input type="range" id="hcp-timeline-range" aria-label="Timeline position" />
        <div class="hcp-timeline-readout" id="hcp-timeline-readout" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div class="hcp-section hcp-section-opacity">
      <button type="button" id="hcp-opacity-toggle" class="hcp-opacity-toggle"
              aria-expanded="false">
        <span>Layer opacity</span> <span class="hcp-caret">&#9656;</span>
      </button>
      <div id="hcp-opacity-list"></div>
    </div>
    <div class="hcp-section hcp-section-advanced">
      <button type="button" id="hcp-advanced-toggle" class="hcp-advanced-toggle"
              aria-expanded="false">
        <span>Advanced</span> <span class="hcp-caret">&#9656;</span>
      </button>
      <div id="hcp-advanced-body" hidden>
        <div class="hcp-advanced-row">
          <label class="hcp-advanced-label" for="hcp-density-mode" data-hcp-help="How the heatmap is worked out. Time Spent favours places you stayed longest, Raw Passes counts every time you went through, and Unique Visits counts each place only once per trip.">Heatmap
            raster mode <span class="hcp-info" aria-hidden="true">i</span></label>
          <select id="hcp-density-mode" class="hcp-select"></select>
        </div>
    <!-- Home marker toggle, separate from Advanced to keep unrelated controls distinct. -->
    <div class="hcp-section hcp-section-home" id="hcp-home-section" hidden>
      <label class="hcp-layer-row" data-hcp-help="Shows or hides the marker for your home location on the map.">
        <input type="checkbox" id="hcp-home-marker" checked />
        <span>Home marker <span class="hcp-info" aria-hidden="true">i</span></span>
      </label>
    </div>
      </div>
    </div>
    <div class="hcp-section hcp-actions">
      <button type="button" id="hcp-fit">Fit map</button>
      <button type="button" id="hcp-reset">Reset</button>
      <button type="button" id="hcp-legend">Legend</button>
    </div>
    <div class="hcp-section hcp-section-export">
      <button type="button" id="hcp-export-png" class="hcp-export"
              data-hcp-help="Saves the map as a picture file you can share or print. It captures exactly what is on screen right now, including the legend.">
        <span>Save as PNG</span> <span class="hcp-info" aria-hidden="true">i</span>
      </button>
      <button type="button" id="hcp-export-geojson" class="hcp-export hcp-export-alt"
              data-hcp-help="Downloads the heatmap data as a GeoJSON file — one polygon per grid cell, with its pass counts, coverage, pace, heart rate and gradient — for opening in QGIS, Mapbox or another mapping tool.">
        <span>Export GeoJSON</span> <span class="hcp-info" aria-hidden="true">i</span>
      </button>
      <button type="button" id="hcp-export-gpx" class="hcp-export hcp-export-alt"
              data-hcp-help="Downloads the GPS tracks themselves as a GPX file — one track per activity, with elevation and heart rate wherever your device recorded them — for Garmin Connect, QGIS, OsmAnd or any other GPX tool.">
        <span>Export GPX</span> <span class="hcp-info" aria-hidden="true">i</span>
      </button>
      <div id="hcp-export-status" class="hcp-export-status" role="status"
           aria-live="polite"></div>
    </div>
  </div>
</div>
