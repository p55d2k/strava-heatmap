<!-- Legend row template (fields: row_id, display, title, grad_css, label_lo, label_hi). -->
<div id="$row_id" class="hcp-legend-row" style="display:$display">
  <div class="hcp-legend-title">$title</div>
  <div class="hcp-legend-swatches" style="background:$grad_css"></div>
  <div class="hcp-legend-scale">
    <span>$label_lo</span><span>$label_hi</span>
  </div>
</div>
